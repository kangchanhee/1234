<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR코드 및 URL 단축 서비스</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
    body { font-family: 'Noto Sans KR', sans-serif; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col justify-between">

  <!-- Header -->
  <header class="w-full p-6 text-center bg-white border-b border-gray-100 shadow-sm">
    <h1 class="text-3xl font-bold tracking-tight text-gray-900">
      <span class="text-blue-600"><i class="fa-solid fa-link"></i> Web Utility Tool</span>
    </h1>
    <p class="text-sm text-gray-500 mt-1">QR코드 생성 및 URL 단축 웹 서비스</p>
  </header>

  <!-- Main Portal Cards -->
  <main class="max-w-4xl mx-auto px-4 py-12 w-full flex-grow flex items-center justify-center">
    <div class="grid md:grid-cols-2 gap-8 w-full">
      
      <!-- Card 1: QR Code Generator -->
      <div class="bg-white p-8 rounded-2xl border border-gray-100 shadow-md hover:shadow-xl transition-all duration-300 flex flex-col items-center text-center group">
        <div class="w-20 h-20 bg-blue-50 text-blue-500 rounded-2xl flex items-center justify-center text-4xl mb-6 group-hover:scale-110 transition-transform duration-300">
          <i class="fa-solid fa-qrcode"></i>
        </div>
        <h2 class="text-2xl font-bold text-gray-800 mb-3">QR코드 생성기</h2>
        <p class="text-gray-500 text-sm mb-8 leading-relaxed">
          원하는 URL이나 텍스트를 입력하여 간편하게 고화질 QR코드를 바로 생성하세요.
        </p>
        <a href="./url2qr/index.html" class="w-full py-3.5 px-6 bg-blue-500 hover:bg-blue-600 text-white font-medium rounded-xl shadow-md transition duration-200 flex items-center justify-center gap-2">
          <span>QR코드 만들기</span>
          <i class="fa-solid fa-arrow-right text-xs"></i>
        </a>
      </div>

      <!-- Card 2: URL Shortener -->
      <div class="bg-white p-8 rounded-2xl border border-gray-100 shadow-md hover:shadow-xl transition-all duration-300 flex flex-col items-center text-center group">
        <div class="w-20 h-20 bg-emerald-50 text-emerald-500 rounded-2xl flex items-center justify-center text-4xl mb-6 group-hover:scale-110 transition-transform duration-300">
          <i class="fa-solid fa-compress text-emerald-500"></i>
        </div>
        <h2 class="text-2xl font-bold text-gray-800 mb-3">URL 단축기</h2>
        <p class="text-gray-500 text-sm mb-8 leading-relaxed">
          긴 웹사이트 주소를 깔끔하고 짧은 주소로 신속하게 단축해 보세요.
        </p>
        <a href="./urlShort/index.html" class="w-full py-3.5 px-6 bg-emerald-500 hover:bg-emerald-600 text-white font-medium rounded-xl shadow-md transition duration-200 flex items-center justify-center gap-2">
          <span>URL 단축하기</span>
          <i class="fa-solid fa-arrow-right text-xs"></i>
        </a>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="w-full p-4 text-center text-xs text-gray-400 border-t border-gray-100 bg-white">
    <p>GitHub Pages 호환 프로젝트 &copy; 2026</p>
  </footer>

</body>
</html>
